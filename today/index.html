<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="apple-touch-icon" href="../today-icon-180.png"><link rel="icon" href="../today-icon-192.png"><link rel="manifest" href="manifest.webmanifest">
<script>window.CASA_API_URL="https://script.google.com/macros/s/AKfycby8ocFc0ypPPbaquHSRa5iugFGpyvtltCOmKFi3ZvEkN6eWoC6d5OcL4jtvGSfMsBX-RQ/exec";window.CASA_FB={"apiKey":"AIzaSyDRmKgWhOVOBf9MRSzhKMHST83rOiNL9ds","authDomain":"casa-shift.firebaseapp.com","projectId":"casa-shift","storageBucket":"casa-shift.firebasestorage.app","messagingSenderId":"237014095241","appId":"1:237014095241:web:cefe69f3b89af561b9fd58","vapidKey":"BN-p0OWix9jA47TCd98Sm-mDXGJwzc-vApJwvVldnYVIYLtE_mu_QavEy7KuchcK1e2O6RHkVdxzJGjsvYGXLd0"};</script><style>
:root{--bg:#f2f2f7;--card:#fff;--fg:#1c1c1e;--sub:#8e8e93;--line:#e5e5ea;--acc:#0f9d6b;--bar:#34c759;--bar2:#a7e3bf;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font:15px -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:rgba(242,242,247,.96);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;border-bottom:.5px solid var(--line)}
.nav{display:flex;align-items:center;gap:8px}
.nav h1{flex:1;margin:0;font-size:22px;font-weight:800;letter-spacing:.01em}
.nav h1 small{display:block;font-size:13px;font-weight:600;color:var(--sub);margin-top:2px}
.nb{border:0;background:#fff;width:40px;height:40px;border-radius:12px;font-size:20px;color:var(--acc);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.tb{border:0;background:var(--acc);color:#fff;border-radius:12px;height:40px;padding:0 14px;font:inherit;font-weight:700}
.tb[hidden]{display:none}
main{padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 24px);display:grid;gap:14px;max-width:760px;margin:0 auto}
.st{background:var(--card);border-radius:18px;padding:14px 12px 8px;box-shadow:0 1px 3px rgba(0,0,0,.05);overflow:hidden}
.sh{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;padding-left:4px}.sh b{font-size:18px}.sh .n{color:var(--sub);font-size:13px;font-weight:600}
.chip{font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;background:#fff4e5;color:#b45309}
.g{display:grid;grid-template-columns:var(--nw,76px) var(--tw,78px) 1fr;align-items:center;column-gap:4px}
.hd{height:18px}.hd .sc{position:relative;height:18px;font-size:10px;color:var(--sub);font-weight:600}.hd .sc span{position:absolute;transform:translateX(-50%);top:1px}
.cnt{height:22px;margin-bottom:4px}.cnt .lb{font-size:11px;color:var(--sub);font-weight:600;padding-left:4px}.cnt .sc{position:relative;height:22px;display:flex;gap:1px}.cnt .sc i{flex:1;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;background:#eceff1;border-radius:2px;font-style:normal;letter-spacing:-.03em}.cnt .sc i.c0{color:transparent}
.row{min-height:38px;border-top:.5px solid var(--line)}.row:nth-child(even){background:#fafafa}
.nm{font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:8px;border-left:4px solid #bcd3f5;line-height:1.1}.nm.emp{border-left-color:#5b8def}
.tm{font-size:14px;font-weight:600;color:#333;white-space:nowrap;font-variant-numeric:tabular-nums}
.tl{position:relative;height:30px}
.gl{position:absolute;top:0;bottom:0;width:0;border-left:.5px dashed #e5e5ea}
.bar{position:absolute;top:3px;height:24px;border-radius:3px;background:#7dc389;border:1px solid #5fae6e;color:#133;font-size:11px;font-weight:700;display:flex;align-items:center;padding:0 6px;white-space:nowrap;overflow:hidden;box-sizing:border-box;z-index:1}.bar.emp{background:#86b7ef;border-color:#5b95dd}.bar.s{font-size:9.5px;padding:0 3px;letter-spacing:-.02em}.bar.xs{font-size:8.5px;padding:0 2px;letter-spacing:-.04em}.bar.hide .t{visibility:hidden}.bar.hide::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:#133}
.tip{position:fixed;z-index:9;background:#1c1c1e;color:#fff;font-size:13px;font-weight:700;padding:6px 10px;border-radius:8px;transform:translate(-50%,-120%);pointer-events:none;white-space:nowrap}
.now{position:absolute;top:0;bottom:0;width:2px;background:#ff3b30;border-radius:1px;z-index:0;opacity:.85}
.empty{color:var(--sub);font-size:14px;padding:6px 4px 8px}
.foot{text-align:right;color:var(--sub);font-size:11px;padding-right:4px}
@media (max-width:420px){.g{--nw:58px;--tw:70px}.nm{font-size:14px}.tm{font-size:12px}.cnt .sc i{font-size:8px}}
.err{background:#fff1f0;color:#b42318;border-radius:12px;padding:12px;font-size:14px}
</style></head><body>
<header><div class="nav"><button class="nb" id="prev" aria-label="前の日">‹</button><h1 id="ttl">今日のシフト<small id="sub">読み込み中…</small></h1><button class="tb" id="today" hidden>今日</button><button class="nb" id="next" aria-label="次の日">›</button></div></header>
<main id="main"></main>
<script>
(function () {
  const API = window.CASA_API_URL, FB = window.CASA_FB; const $ = s => document.querySelector(s); const main = $('#main');
  const WD = '日月火水木金土'; const pad = n => ('0' + n).slice(-2); const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const bizToday = () => { const d = new Date(); if (d.getHours() < 7) d.setDate(d.getDate() - 1); return d; }; /* 朝7時までは前の日（夜通しの営業） */
  let day = bizToday(); let data = null;
  const clk = h => { const x = h >= 24 ? h - 24 : h; return (h >= 24 ? '翌' : '') + (Number.isInteger(x) ? String(x) : x.toFixed(1)); }; /* 表記はシフト表と同じ: 13.5・翌5 */
  const lsGet = k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }; const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  async function fromFs() { const k = lsGet('casa-admin-fsk'); if (!/^[0-9a-f]{40,}$/.test(k) || !FB || typeof DecompressionStream === 'undefined') return null;
    const res = await fetch('https://firestore.googleapis.com/v1/projects/' + FB.projectId + '/databases/(default)/documents/v/' + k + '/admin/snap?key=' + FB.apiKey); if (!res.ok) return null;
    const j = await res.json(); const z = j.fields && j.fields.z && j.fields.z.stringValue; if (!z) return null; const bin = atob(z); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return JSON.parse(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text()); }
  async function fromApi() { const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ api: 'admin_load', args: [{}] }) }); const j = JSON.parse(await r.text()); if (j.__err || j.error) throw new Error(j.__err || j.error); if (j.ok && j.ok.fsk) lsSet('casa-admin-fsk', j.ok.fsk); return j.ok; }
  function keep(d) { data = d; try { const slim = { rev: d.rev, docs: {} }; Object.keys(d.docs).forEach(p => { if (/^(config\/|sheets\/)/.test(p)) slim.docs[p] = d.docs[p]; }); lsSet('casa-today-cache', JSON.stringify(slim)); } catch (e) {} }
  async function load() { let d = null; try { d = await fromFs(); } catch (e) {} if (!d) d = await fromApi(); if (!data || d.rev >= (data.rev || 0)) { keep(d); render(); } }
  function stores() { const m = data.docs['config/main']; const list = (m && m.data && m.data.stores) || [{ id: 'ueno', name: '上野' }]; return list; }
  function sheetFor(store, ds) { let best = null; Object.keys(data.docs).forEach(p => { if (p.indexOf('sheets/') !== 0) return; const s = data.docs[p].data; if (!s || (s.store || 'ueno') !== store || !s.start || !s.days) return; if (s.phase !== 'fixed' && s.phase !== 'draft') return;
      const st = new Date(s.start + 'T00:00:00'); const i = Math.round((new Date(ds + 'T00:00:00') - st) / 864e5); if (i < 0 || i >= s.days) return;
      const n = Object.keys(s.cells || {}).filter(k => k.endsWith('|' + i)).length; const score = (s.phase === 'fixed' ? 2 : 0) + (n ? 1 : 0); if (!best || score > best.score) best = { s, i, score }; }); return best; }
  function render() {
    if (!data) return; const ds = iso(day); const isT = ds === iso(bizToday());
    $('#ttl').firstChild.nodeValue = isT ? '今日のシフト' : (day.getMonth() + 1) + '/' + day.getDate() + 'のシフト';
    $('#sub').textContent = (day.getMonth() + 1) + '月' + day.getDate() + '日（' + WD[day.getDay()] + '）'; $('#today').hidden = isT;
    const nowH = (() => { const n = new Date(); let h = n.getHours() + n.getMinutes() / 60; if (h < 7) h += 24; return h; })();
    main.innerHTML = stores().map(st => {
      const cfg = (data.docs['config/' + st.id] || {}).data || {}; const staff = {}; (cfg.staff || []).forEach(x => { staff[x.id] = x; });
      const hit = sheetFor(st.id, ds);
      if (!hit) return `<section class="st"><div class="sh"><b>${esc(st.name)}</b></div><div class="empty">この日のシフト表はまだありません</div></section>`;
      const rows = []; Object.keys(hit.s.cells || {}).forEach(k => { const [sid, ii] = k.split('|'); if (+ii !== hit.i) return; const c = hit.s.cells[k]; if (!c || c.off || c.s == null || c.e == null) return; const p = staff[sid] || { name: '?' }; if (p.placeholder) return; rows.push({ p, c }); });
      rows.sort((a, b) => a.c.s - b.c.s || a.c.e - b.c.e);
      const chip = hit.s.phase === 'fixed' ? (hit.s.published ? '' : '<span class="chip">未公開</span>') : '<span class="chip">作成中</span>';
      if (!rows.length) return `<section class="st"><div class="sh"><b>${esc(st.name)}</b>${chip}</div><div class="empty">この日の出勤はありません</div></section>`;
      /* 表示の時間帯: 店の設定（ガント表示 開始・終了）を使い、シフトがはみ出す時だけ広げる */
      /* 表示の時間帯: その日のシフトの範囲＋前後1時間（最低8時間幅）。狭い画面でも潰れないように */
      let a = Math.floor(Math.min(...rows.map(r => r.c.s))) - 1, b = Math.ceil(Math.max(...rows.map(r => r.c.e))) + 1; if (b - a < 8) b = a + 8; const span = b - a; const X = h => ((h - a) / span * 100).toFixed(2) + '%';
      const step = span > 20 ? 3 : span > 12 ? 2 : 1; const hours = []; for (let h = a; h <= b; h++) hours.push(h); const labels = hours.filter(h => (h - a) % step === 0);
      const grid = hours.map(h => `<i class="gl" style="left:${X(h)}"></i>`).join('') + (isT && nowH > a && nowH < b ? `<i class="now" style="left:${X(nowH)}"></i>` : '');
      /* 人数: 30分ごとに何人いるか（多いほど濃い緑） */
      const slots = []; for (let t = a; t < b; t += .5) slots.push(rows.filter(r => r.c.s <= t && t < r.c.e).length); const mx = Math.max(1, ...slots);
      const col = n => { if (!n) return '#eceff1'; const g = [[197,230,197],[141,201,147],[77,164,89],[36,120,52]]; const i = Math.min(3, Math.floor(n / mx * 3.999)); return 'rgb(' + g[i].join(',') + ')'; };
      const cnt = slots.map(n => `<i class="${n ? '' : 'c0'}" style="background:${col(n)}">${n}</i>`).join('');
      const num = h => Number.isInteger(h) ? String(h) : h.toFixed(1);
      return `<section class="st"><div class="sh"><b>${esc(st.name)}</b><span class="n">${rows.length}人</span>${chip}</div>
        <div class="g hd"><span></span><span></span><div class="sc">${labels.map(h => `<span style="left:${X(h)}">${h}</span>`).join('')}</div></div>
        <div class="g cnt"><span class="lb">人数</span><span></span><div class="sc">${cnt}</div></div>
        ${rows.map(r => { const w = (r.c.e - r.c.s) / span; const emp = r.p.group === '社員';
          return `<div class="g row"><div class="nm${emp ? ' emp' : ''}" title="${esc(r.p.name)}">${esc(r.p.name)}</div><div class="tm">${clk(r.c.s)}〜${clk(r.c.e)}</div><div class="tl">${grid}<div class="bar${emp ? ' emp' : ''}" style="left:${X(r.c.s)};width:${(w * 100).toFixed(2)}%"><span class="t">${num(r.c.s)}-${num(r.c.e)}</span></div></div></div>`; }).join('')}</section>`;
    }).join('') + '<div class="foot">' + (day.getMonth() + 1) + '/' + day.getDate() + ' 作成 ・ casaシフト表</div>';
    fitBars();
  }
  function fitBars() { main.querySelectorAll('.bar').forEach(b => { const t = b.querySelector('.t'); if (!t) return; b.classList.remove('hide'); const over = () => b.scrollWidth > b.clientWidth + 1; if (!over()) return; if (!b.classList.contains('s') && !b.classList.contains('xs')) { b.classList.add('s'); if (!over()) return; } if (!b.classList.contains('xs')) { b.classList.remove('s'); b.classList.add('xs'); if (!over()) return; } b.classList.add('hide'); b.dataset.tip = t.textContent; }); } /* 幅に入らない時は文字を隠し、押した時に出す（2026-11-07 はみ出し対策） */
  main.addEventListener('click', e => { const b = e.target.closest('.bar.hide'); document.querySelectorAll('.tip').forEach(x => x.remove()); if (!b) return; const r = b.getBoundingClientRect(); const d = document.createElement('div'); d.className = 'tip'; d.textContent = b.dataset.tip; d.style.left = (r.left + r.width / 2) + 'px'; d.style.top = r.top + 'px'; document.body.appendChild(d); setTimeout(() => d.remove(), 2500); });
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const move = n => { day = new Date(day); day.setDate(day.getDate() + n); render(); };
  $('#prev').onclick = () => move(-1); $('#next').onclick = () => move(1); $('#today').onclick = () => { day = bizToday(); render(); };
  let sx = null; main.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true }); main.addEventListener('touchend', e => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 70) move(dx < 0 ? 1 : -1); sx = null; });
  try { const c = JSON.parse(lsGet('casa-today-cache') || 'null'); if (c && c.docs) { data = c; render(); } } catch (e) {}
  load().catch(e => { if (!data) main.innerHTML = '<div class="err">読み込めませんでした。電波の良い所でもう一度開いてください。<br><small>' + esc(e.message) + '</small></div>'; });
  let follow = true; $('#prev').addEventListener('click', () => { follow = false; }); $('#next').addEventListener('click', () => { follow = false; }); $('#today').addEventListener('click', () => { follow = true; });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { if (follow) day = bizToday(); render(); load().catch(() => {}); } }); /* 開き直したら今日に戻る（日付を動かしていた時はそのまま） */
  setInterval(() => { if (document.visibilityState === 'visible') render(); }, 60000); /* 今の時刻の線 */
  if ('serviceWorker' in navigator && /github\.io$/.test(location.hostname)) addEventListener('load', () => navigator.serviceWorker.register('/casa-shift/sw.js', { scope: '/casa-shift/' }).catch(() => {}));
})();
</script></body></html>
