$('#who').onclick = e => { e.stopPropagation(); let m = document.querySelector('.umenu'); if (m) { m.remove(); return; } m = document.createElement('div'); m.className = 'umenu'; m.innerHTML = ((S.home && (S.home.allStores || []).length > 1) ? '<button id="umStores">店舗の設定</button>' : '') + '<button id="umLogout">ログアウト</button>';
  const us = m.querySelector('#umStores'); if (us) us.onclick = () => { m.remove(); storesScreen(); }; document.body.appendChild(m); m.querySelector('#umLogout').onclick = () => { m.remove(); $('#logout').onclick(); }; setTimeout(() => document.addEventListener('click', function c(ev) { if (!m.contains(ev.target)) { m.remove(); document.removeEventListener('click', c); } }), 0); };
