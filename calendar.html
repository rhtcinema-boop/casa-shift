<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0"><title>シフトをカレンダーに入れる</title>
<style>
:root{--bg:#f6f3ee;--fg:#22201c;--sub:#6d675e;--card:#fff;--line:#e4ded4;--acc:#c2410c;--acc2:#fff3ea;--ios:#007aff;--g:#1a73e8;--ok:#15803d;--shade:rgba(0,0,0,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1916;--fg:#f1ede6;--sub:#a59d91;--card:#26241f;--line:#3a372f;--acc:#fb923c;--acc2:#3a2516;--shade:rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1916;--fg:#f1ede6;--sub:#a59d91;--card:#26241f;--line:#3a372f;--acc:#fb923c;--acc2:#3a2516;--shade:rgba(0,0,0,.55);color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;padding:20px 16px 40px}
.wrap{max-width:760px;margin:0 auto;display:grid;gap:18px}
h1{font-size:22px;margin:0;text-wrap:balance}
.lead{color:var(--sub);margin:4px 0 0;line-height:1.6}
.seg{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;width:max-content}
.seg button{border:0;background:none;color:var(--fg);font:inherit;font-weight:600;padding:8px 16px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--acc);color:#fff}
.stage{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
@media (max-width:620px){.stage{grid-template-columns:1fr;justify-items:center}}
.phone{width:260px;max-width:100%;aspect-ratio:9/18.5;border-radius:38px;background:#111;padding:10px;box-shadow:0 18px 40px rgba(0,0,0,.25);position:relative}
.scr{position:absolute;inset:10px;border-radius:30px;overflow:hidden;background:#fff;color:#222;font-size:12px}
.notch{position:absolute;top:16px;left:50%;transform:translateX(-50%);width:80px;height:20px;border-radius:12px;background:#111;z-index:9}
.sc{position:absolute;inset:0;padding:44px 14px 14px;opacity:0;transition:opacity .45s;display:flex;flex-direction:column;gap:8px}
.sc.on{opacity:1}
.hd{font-weight:700;font-size:15px}
.cardp{background:#f4f1ec;border-radius:12px;padding:10px;line-height:1.5}
.shift{display:flex;justify-content:space-between;border-bottom:1px solid #e8e2d8;padding:4px 0}
.btn{display:block;text-align:center;border-radius:10px;padding:10px;font-weight:700;background:#c2410c;color:#fff}
.btn.ghost{background:#fff;color:#c2410c;border:1px solid #c2410c}
.btn.g{background:#1a73e8}
.hl{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(194,65,12,.0)}50%{box-shadow:0 0 0 6px rgba(194,65,12,.35)}}
.tap{position:absolute;width:34px;height:34px;border-radius:50%;background:rgba(255,190,90,.75);border:2px solid #fff;pointer-events:none;z-index:20;opacity:0;transform:scale(.6)}
.tap.go{animation:tap 1.1s ease-out forwards}
@keyframes tap{0%{opacity:0;transform:scale(1.4)}35%{opacity:1;transform:scale(.8)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.5)}}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center;padding:16px}
.alert{background:rgba(245,245,247,.97);border-radius:14px;width:88%;text-align:center;overflow:hidden}
.alert p{margin:0;padding:14px 12px;line-height:1.5}
.alert .row{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #ccc}
.alert .row span{padding:10px;color:#007aff}
.alert .row span+span{border-left:1px solid #ccc;font-weight:700}
.navb{display:flex;justify-content:space-between;color:#007aff;font-weight:600;margin:-4px 0 4px}
.list{background:#f2f2f7;border-radius:10px;overflow:hidden}
.list div{padding:9px 10px;border-bottom:1px solid #e1e1e6;display:flex;justify-content:space-between}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:10px}
.cal b{color:#888;font-weight:500}
.cal span{padding:5px 0;border-radius:6px}
.cal .ev{background:#fde7d6;color:#9a3412;font-weight:700}
.evl div{border-left:3px solid #ea580c;background:#fff4ec;padding:6px 8px;border-radius:6px;margin-bottom:5px}
.gbar{background:#1a73e8;color:#fff;margin:-44px -14px 6px;padding:44px 14px 10px;font-weight:700}
.side{display:grid;gap:12px;min-width:0}
.cap{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;min-height:120px}
.step{font-size:12px;letter-spacing:.08em;color:var(--acc);font-weight:700}
.cap h2{margin:6px 0 6px;font-size:20px;text-wrap:balance}
.cap p{margin:0;color:var(--sub);line-height:1.6}
.dots{display:flex;gap:6px}
.dots i{flex:1;height:5px;border-radius:3px;background:var(--line);overflow:hidden;position:relative}
.dots i em{position:absolute;inset:0;background:var(--acc);transform-origin:left;transform:scaleX(0)}
.ctl{display:flex;gap:8px;flex-wrap:wrap}
.ctl button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:8px 14px;cursor:pointer}
.note{font-size:13px;color:var(--sub);line-height:1.7;background:var(--acc2);border-radius:12px;padding:12px 14px}
</style>
<div class="wrap">
  <div>
    <h1>シフトをスマホのカレンダーに入れる</h1>
    <p class="lead">1回だけ登録すれば、新しいシフトが公開されるたびに自動で増えます（約30秒）。</p>
  </div>
  <div class="seg" role="tablist"><button data-os="ios" class="on">iPhone</button><button data-os="and">Android・Google</button></div>
  <div class="stage">
    <div class="phone"><div class="notch"></div><div class="scr" id="scr"></div></div>
    <div class="side">
      <div class="dots" id="dots"></div>
      <div class="cap"><div class="step" id="stp"></div><h2 id="ttl"></h2><p id="txt"></p></div>
      <div class="ctl"><button id="prev">◀ 前へ</button><button id="play">⏸ 一時停止</button><button id="next">次へ ▶</button></div>
      <div class="note">うまくいかない時は「ほかのやり方」を開いて URL をコピーし、カレンダーアプリの「URLで購読」に貼ってください。<br>「今のシフトを1回だけ入れる」は自動で更新されないので、普段は使わなくてOKです。</div>
    </div>
  </div>
</div>
<script>
const shifts=`<div class="cardp"><b>あなたのシフト（10月後半）</b><div class="shift"><span>10/17(金)</span><span>18:00–23:00</span></div><div class="shift"><span>10/19(日)</span><span>15:00–22:00</span></div><div class="shift"><span>10/24(金)</span><span>18:00–23:00</span></div></div>`;
const calv=`<div class="cal">${'日月火水木金土'.split('').map(d=>`<b>${d}</b>`).join('')}${Array.from({length:31},(_,i)=>`<span class="${[16,18,23,26].includes(i)?'ev':''}">${i+1}</span>`).join('')}</div><div class="evl"><div><b>casa上野 出勤</b><br>10/24(金) 18:00–23:00</div><div><b>casa上野 出勤</b><br>10/26(日) 15:00–22:00</div></div>`;
const FLOWS={
ios:[
 {t:'スタッフ用ページを開く',p:'いつものシフト提出ページを開き、自分の名前でログインします。',h:`<div class="hd">casa上野</div>${shifts}<div class="btn ghost hl" id="T">スマホのカレンダーに入れる</div>`,tap:1},
 {t:'「iPhoneのカレンダーに入れる」',p:'iPhoneなら一番上に大きく出ます。これを押します。',h:`<div class="hd">スマホのカレンダーに入れる</div><div class="cardp">1回登録すれば、あとは自動。<br>あなたの勤務だけが入ります。</div><div class="cardp"><b>iPhone の人はこちら</b><div class="btn hl" id="T" style="margin-top:6px">iPhoneのカレンダーに入れる</div></div>`,tap:1},
 {t:'「照会」を押す',p:'「照会しますか？」と聞かれたら「照会」を押します。',h:`<div class="hd">スマホのカレンダーに入れる</div><div class="cardp">…</div><div class="dim"><div class="alert"><p><b>カレンダーを照会しますか？</b><br>casa上野 シフト</p><div class="row"><span>キャンセル</span><span id="T">照会</span></div></div></div>`,tap:1},
 {t:'右上の「追加」で完了',p:'設定画面が出たら、そのまま右上の「追加」を押せば終わりです。',h:`<div class="navb"><span>キャンセル</span><span>照会</span><span id="T">追加</span></div><div class="list"><div><span>名前</span><span>casa上野 シフト</span></div><div><span>カラー</span><span style="color:#ea580c">●</span></div><div><span>照会</span><span>webcal://…</span></div><div><span>自動更新</span><span>オン</span></div></div>`,tap:1},
 {t:'カレンダーにシフトが入りました',p:'「casa上野 出勤」として入ります。次のシフトが公開されると自動で増えます。',h:`<div class="hd">10月</div>${calv}`}
],
and:[
 {t:'スタッフ用ページを開く',p:'いつものシフト提出ページを開き、自分の名前でログインします。',h:`<div class="hd">casa上野</div>${shifts}<div class="btn ghost hl" id="T">スマホのカレンダーに入れる</div>`,tap:1},
 {t:'「Googleカレンダーに入れる」',p:'Androidなら一番上に出ます。これを押すとGoogleカレンダーが開きます。',h:`<div class="hd">スマホのカレンダーに入れる</div><div class="cardp">1回登録すれば、あとは自動。<br>あなたの勤務だけが入ります。</div><div class="cardp"><b>Android の人はこちら</b><div class="btn g hl" id="T" style="margin-top:6px">Googleカレンダーに入れる</div></div>`,tap:1},
 {t:'「追加」を押す',p:'「カレンダーを追加しますか？」と出たら「追加」を押します。',h:`<div class="gbar">Google カレンダー</div><div class="dim" style="top:60px"><div class="alert" style="text-align:left"><p><b>カレンダーを追加しますか？</b><br>casa上野 シフト</p><div class="row"><span style="text-align:center">キャンセル</span><span id="T" style="text-align:center;color:#1a73e8">追加</span></div></div></div>`,tap:1},
 {t:'少し待つと入ります',p:'スマホのGoogleカレンダーには数分〜数時間で出ます。あとは自動で増えます。',h:`<div class="gbar">10月</div>${calv}`}
]};
let os='ios',i=0,playing=true,timer,t0;const DUR=4200;
const $=id=>document.getElementById(id),scr=$('scr');
function show(){
  const f=FLOWS[os],s=f[i];
  scr.innerHTML=`<div class="sc">${s.h}</div><div class="tap" id="tp"></div>`;
  requestAnimationFrame(()=>scr.firstChild.classList.add('on'));
  $('stp').textContent=`STEP ${i+1} / ${f.length}`;$('ttl').textContent=s.t;$('txt').textContent=s.p;
  $('dots').innerHTML=f.map((_,k)=>`<i><em style="transform:scaleX(${k<i?1:0})"></em></i>`).join('');
  if(s.tap)setTimeout(()=>{const T=document.getElementById('T'),tp=$('tp');if(!T||!tp)return;const a=T.getBoundingClientRect(),b=scr.getBoundingClientRect();tp.style.left=(a.left-b.left+a.width/2-17)+'px';tp.style.top=(a.top-b.top+a.height/2-17)+'px';tp.classList.add('go')},DUR-1500);
  t0=performance.now();
}
function tick(now){const f=FLOWS[os];if(playing){const p=Math.min(1,(now-t0)/DUR);const em=$('dots').children[i]?.firstChild;if(em)em.style.transform=`scaleX(${p})`;if(p>=1){i=(i+1)%f.length;show()}}else t0=now-(parseFloat($('dots').children[i]?.firstChild.style.transform.slice(7))||0)*DUR;requestAnimationFrame(tick)}
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b));os=b.dataset.os;i=0;show()});
$('prev').onclick=()=>{i=(i-1+FLOWS[os].length)%FLOWS[os].length;show()};
$('next').onclick=()=>{i=(i+1)%FLOWS[os].length;show()};
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'⏸ 一時停止':'▶ 再生'};
if(/Android/i.test(navigator.userAgent))document.querySelector('[data-os="and"]').click();else show();
requestAnimationFrame(tick);
</script>
</body></html>
